<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyaratne Stores POS - Direct PNG Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        .search-results { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; display: none; }
        
        /* Receipt Styling for PNG Capture */
        #print-area { 
            width: 380px; 
            padding: 15px; 
            background: white; 
            color: black; 
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.2;
            margin: 0 auto;
        }
        .receipt-border { border: 2px solid black; padding: 8px; margin-bottom: 10px; text-align: center; border-radius: 10px; }
        #receipt-logo-img { max-width: 150px; max-height: 100px; margin: 0 auto 10px; display: none; object-fit: contain; }
        
        /* Hidden Print Frame */
        #print-frame { display: none; }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black opacity-50 z-[70] hidden"></div>
    
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-slate-900 text-white z-[80] shadow-xl p-4">
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <h2 class="font-bold text-xl">පියරත්න POS</h2>
            <button onclick="toggleSidebar()" class="text-2xl">&times;</button>
        </div>
        <div class="flex flex-col gap-4 font-semibold">
            <button onclick="showTab('billing'); toggleSidebar()" class="text-left py-2 border-b border-slate-700 hover:text-blue-400">🛒 BILLING</button>
            <button onclick="showTab('inventory'); toggleSidebar()" class="text-left py-2 border-b border-slate-700 hover:text-blue-400">📦 STOCK</button>
            <button onclick="showTab('customers'); toggleSidebar()" class="text-left py-2 border-b border-slate-700 hover:text-blue-400">👥 CUSTOMERS</button>
            <button onclick="showTab('reports'); toggleSidebar()" class="text-left py-2 border-b border-slate-700 hover:text-blue-400">📊 REPORTS</button>
            <button onclick="showTab('printer'); toggleSidebar()" class="text-left py-2 border-b border-slate-700 text-yellow-400">🖨️ PRINTER SETUP</button>
        </div>
    </nav>

    <header class="bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="text-2xl">☰</button>
            <h1 class="font-bold text-lg">පියරත්න සටොර්ස්</h1>
        </div>
        <button onclick="startScanner()" class="bg-blue-500 px-4 py-1 rounded-full text-sm font-bold shadow-lg">📷 SCAN</button>
    </header>

    <main class="p-2">
        <div id="tab-billing" class="tab-content active">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-lg space-y-4">
                    <div class="relative">
                        <label class="text-xs font-bold text-gray-500 uppercase">Search Item</label>
                        <input type="text" id="bill-search" oninput="searchItems(this.value)" placeholder="Search..." class="w-full p-3 border-2 border-blue-400 rounded-lg">
                        <div id="search-results" class="search-results absolute w-full bg-white z-10 shadow-2xl"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="hidden" id="bill-code">
                        <input type="number" id="bill-qty" value="1" step="0.001" class="w-full p-2 border-2 rounded-lg font-bold">
                        <input type="number" id="bill-discount" value="0" class="w-full p-2 border-2 rounded-lg font-bold text-red-600">
                    </div>

                    <select id="bill-customer" class="w-full p-2 border-2 rounded-lg border-red-500 font-bold" onchange="updateLivePreview()">
                        <option value="">Select Customer (Required)</option>
                    </select>

                    <div class="flex gap-2">
                        <button onclick="setPaymentMode('cash')" id="btn-cash" class="flex-1 py-3 rounded-lg bg-green-700 text-white font-bold">CASH</button>
                        <button onclick="setPaymentMode('credit')" id="btn-credit" class="flex-1 py-3 rounded-lg bg-gray-200 font-bold">CREDIT</button>
                    </div>

                    <button onclick="addToCart()" class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold shadow-xl">ADD TO CART</button>
                    <div id="cart-items" class="text-sm space-y-2 border-t pt-4"></div>
                </div>

                <div class="bg-gray-400 p-4 rounded-xl shadow-inner">
                    <p class="text-center font-bold text-xs text-white mb-3 uppercase">Live Preview</p>
                    <div id="print-area" class="shadow-2xl">
                        <div class="receipt-border">
                            <img id="receipt-logo-img" src="" alt="Logo">
                            <p class="font-bold text-xl">පියරත්න සටොර්ස්</p>
                            <p class="text-sm">දාගම-මාඒළිය | 075 4990060</p>
                        </div>
                        <div class="flex justify-between border-b-2 border-black font-bold text-[11px] mb-1">
                            <span style="width:15%">Qty</span><span style="width:25%">Price</span><span style="width:25%">Net</span><span style="width:35%; text-align:right">Total</span>
                        </div>
                        <div id="print-items" class="text-[11px]"></div>
                        <hr class="border-black my-2">
                        <div id="print-totals" class="text-right font-bold text-xs space-y-1"></div>
                    </div>
                    <button onclick="preparePrint()" class="w-full bg-orange-600 text-white py-5 rounded-xl mt-6 font-bold text-xl shadow-2xl hover:bg-orange-700">
                        FINISH & PRINT PNG
                    </button>
                </div>
            </div>
        </div>

        <div id="tab-printer" class="tab-content">
            <div class="bg-white p-6 rounded-xl shadow-lg max-w-lg mx-auto">
                <h2 class="font-bold text-xl mb-4 border-b pb-2">🖨️ Printer & Logo</h2>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2 uppercase">Upload Shop Logo:</label>
                    <input type="file" id="logo-upload" accept="image/*" onchange="handleLogoUpload(event)" class="w-full p-2 border-2 border-dashed border-blue-300 rounded-lg">
                </div>
                <div id="printer-logo-preview" class="hidden mt-4 p-4 bg-gray-50 rounded-lg border text-center">
                    <img id="setup-logo-img" src="" class="max-h-32 mx-auto">
                    <button onclick="removeLogo()" class="mt-2 text-red-600 text-xs font-bold underline">Remove</button>
                </div>
                <div class="mt-6 p-4 bg-blue-50 border rounded text-xs text-blue-700">
                    <p><b>Print Mode:</b> PNG Capture</p>
                    <p>This will capture your bill as an image and open the system print menu. Select your thermal printer from the list.</p>
                </div>
            </div>
        </div>
        
        <div id="tab-inventory" class="tab-content"><div id="inventory-list" class="space-y-2"></div></div>
        <div id="tab-customers" class="tab-content"><div id="customer-list" class="space-y-2"></div></div>
        <div id="tab-reports" class="tab-content"><div id="bill-history-list" class="space-y-2"></div></div>
    </main>

    <script>
        const db = new Dexie("PiyaratneStoresDB");
        db.version(2).stores({
            inventory: "code, name, price, wholesale, stock",
            customers: "name, phone, status, creditAmount",
            sales: "++id, date, total, profit, customer, type, items",
            draftCart: "++id, name, code, qty, price, wholesale, total, discount"
        });

        let cart = [];
        let paymentMode = 'cash';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            if(id === 'inventory') renderInventory();
            if(id === 'customers') renderCustomers();
        }

        // --- LOGO MANAGEMENT ---
        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    localStorage.setItem('pos_logo', e.target.result);
                    loadLogo();
                };
                reader.readAsDataURL(file);
            }
        }

        function loadLogo() {
            const saved = localStorage.getItem('pos_logo');
            if (saved) {
                document.getElementById('receipt-logo-img').src = saved;
                document.getElementById('receipt-logo-img').style.display = 'block';
                document.getElementById('setup-logo-img').src = saved;
                document.getElementById('printer-logo-preview').classList.remove('hidden');
            }
        }

        function removeLogo() { localStorage.removeItem('pos_logo'); location.reload(); }

        // --- CORE LOGIC (Kept from before) ---
        async function searchItems(query) {
            const resultsDiv = document.getElementById('search-results');
            if (query.length < 1) { resultsDiv.style.display = 'none'; return; }
            const items = await db.inventory.filter(i => i.name.toLowerCase().includes(query.toLowerCase()) || i.code.includes(query)).toArray();
            resultsDiv.innerHTML = items.map(i => `<div class="p-2 border-b" onclick="selectItem('${i.code}','${i.name}')">${i.name}</div>`).join('');
            resultsDiv.style.display = 'block';
        }

        function selectItem(code, name) {
            document.getElementById('bill-code').value = code;
            document.getElementById('bill-search').value = name;
            document.getElementById('search-results').style.display = 'none';
        }

        async function addToCart() {
            const code = document.getElementById('bill-code').value;
            const item = await db.inventory.get(code);
            if(item) {
                const qty = parseFloat(document.getElementById('bill-qty').value);
                const discount = parseFloat(document.getElementById('bill-discount').value) || 0;
                cart.push({ ...item, qty, discount, total: (item.price * qty) - discount });
                renderCart();
                updateLivePreview();
            }
        }

        function renderCart() {
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between border-b p-1"><span>${i.name} x ${i.qty}</span><span>${i.total.toFixed(2)}</span></div>
            `).join('');
        }

        function updateLivePreview() {
            document.getElementById('print-items').innerHTML = cart.map(i => `
                <div class="flex justify-between"><span>${i.qty}</span><span>${i.price}</span><span>${i.total.toFixed(2)}</span></div>
                <div class="font-bold">${i.name}</div>
            `).join('');
            const subtotal = cart.reduce((sum, i) => sum + i.total, 0);
            document.getElementById('print-totals').innerHTML = `<p>TOTAL: LKR ${subtotal.toFixed(2)}</p>`;
        }

        // --- DIRECT PNG PRINT FUNCTION ---
        async function preparePrint() {
            const subtotal = cart.reduce((sum, i) => sum + i.total, 0);
            const cash = parseFloat(prompt("Cash Received:") || "0");
            document.getElementById('print-totals').innerHTML += `<p>CASH: ${cash.toFixed(2)}</p><p>BALANCE: ${(cash - subtotal).toFixed(2)}</p>`;

            // 1. Capture the receipt as PNG
            const canvas = await html2canvas(document.getElementById('print-area'), { scale: 3 });
            const dataURL = canvas.toDataURL("image/png");

            // 2. Open a new window and print only the image
            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html>
                    <body style="margin:0; text-align:center;">
                        <img src="${dataURL}" style="width:100%; max-width:380px;">
                        <script>
                            window.onload = function() { 
                                window.print(); 
                                setTimeout(() => { window.close(); }, 500);
                            };
                        <\/script>
                    </body>
                </html>
            `);
            printWin.document.close();

            // Clear and Save (Logic remains)
            cart = [];
            renderCart();
            updateLivePreview();
        }

        loadLogo();
    </script>
</body>
</html>
