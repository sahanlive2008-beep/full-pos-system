<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyaratne Stores POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .receipt-border { border: 2px solid black; border-radius: 10px; padding: 5px; margin-bottom: 5px; line-height: 1.1; }
        #live-preview-container { border: 2px dashed #3b82f6; background: white; margin-top: 20px; padding: 10px; }
        #sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        .search-results { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; display: none; }
        .search-results div { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-results div:hover { background-color: #f3f4f6; }
        #receipt-logo { max-width: 100%; height: auto; display: none; margin: 0 auto 5px auto; }
        #reader { width: 100% !important; min-height: 250px; background: #000; }
        
        /* Fixed Print Area Styling */
        #print-area { 
            line-height: 1.2 !important; 
            padding: 5px !important; 
            background: white !important;
            color: black !important;
        }

        #items-square-container {
            border: 1.5px solid black;
            border-radius: 10px;
            padding: 6px;
            margin: 5px 0;
        }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black opacity-50 z-[70] hidden"></div>
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-slate-900 text-white z-[80] shadow-xl p-4">
        <div class="flex justify-between items-center mb-8">
            <h2 class="font-bold text-xl">Menu</h2>
            <button onclick="toggleSidebar()" class="text-2xl">&times;</button>
        </div>
        <div class="flex flex-col gap-4 font-semibold">
            <button onclick="showTab('billing'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">🛒 BILLING</button>
            <button onclick="showTab('inventory'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">📦 STOCK</button>
            <button onclick="showTab('add-items'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">➕ ADD ITEM</button>
            <button onclick="showTab('customers'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">👥 CUSTOMERS</button>
            <button onclick="showTab('reports'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">📊 REPORTS</button>
            <button onclick="showTab('printer'); toggleSidebar()" class="text-left py-2 border-b border-slate-700">🖨️ PRINTER SETUP</button>
        </div>
    </nav>

    <header class="bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="text-2xl">☰</button>
            <h1 class="font-bold text-lg">පියරත්න සටොර්ස්</h1>
        </div>
        <div id="scanner-container" class="hidden fixed inset-0 bg-black z-[100] flex flex-col">
            <div id="reader" style="flex: 1;"></div>
            <button onclick="stopScanner()" class="bg-red-600 text-white w-full py-6 font-bold text-lg">Close Scanner</button>
        </div>
        <button onclick="startScanner()" class="bg-blue-500 px-3 py-1 rounded text-sm">📷 Scan</button>
    </header>

    <main class="p-2">
        <div id="tab-billing" class="tab-content active">
            <div class="bg-white p-3 rounded shadow mb-3">
                <div class="relative mb-3">
                    <input type="text" id="bill-search" onclick="searchItems(this.value)" oninput="searchItems(this.value)" placeholder="Search Item Name or Code..." class="w-full p-3 border-2 border-blue-400 rounded-lg">
                    <div id="search-results" class="search-results absolute w-full bg-white z-10 shadow-lg"></div>
                </div>
                
                <input type="hidden" id="bill-code">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-end">
                    <div class="md:col-span-4">
                        <label class="text-[10px] font-bold text-gray-500 uppercase">පාරිභෝගිකයා (Customer)</label>
                        <select id="bill-customer" class="w-full p-2 border rounded border-red-500 text-sm" onchange="updateLivePreview()">
                            <option value="">Select Customer</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-[10px] font-bold text-blue-600 uppercase">වට්ටම් (Discount)</label>
                        <input type="number" id="bill-discount" value="0" step="0.01" class="p-2 border border-blue-300 rounded w-full text-sm">
                    </div>
                    <div class="md:col-span-4 flex gap-1 h-[38px]">
                        <button onclick="setPaymentMode('cash')" id="btn-cash" class="flex-1 rounded bg-green-700 text-white text-xs font-bold">CASH</button>
                        <button onclick="setPaymentMode('credit')" id="btn-credit" class="flex-1 rounded bg-gray-200 text-xs font-bold">CREDIT</button>
                    </div>
                    <div class="md:col-span-2">
                        <button onclick="addUnlistedItem()" class="w-full h-[38px] text-blue-600 text-[10px] border border-blue-600 rounded font-bold uppercase">+ Unlisted</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded shadow p-3">
                <div id="cart-items" class="text-sm"></div>
                <div class="mt-4 border-t pt-2">
                    <div class="flex justify-between text-lg font-bold">
                        <span>Total (LKR):</span>
                        <span id="cart-total">0.00</span>
                    </div>
                    <button onclick="directPrint()" class="w-full bg-blue-600 text-white py-3 rounded mt-3 font-bold">FINISH & PRINT</button>
                </div>
            </div>

            <div id="live-preview-container">
                <div id="print-area" style="font-family: 'Courier New', monospace; width: 58mm; margin: 0 auto; background: white;">
                    <div class="receipt-border text-center" style="margin-bottom: 2px;">
                        <img id="receipt-logo" src="" alt="Logo">
                        <div style="font-weight: bold; font-size: 14px;">පියරත්න සටොර්ස්</div>
                        <div style="font-size: 11px;">දාගම-මාඒළිය | 075 4990060</div>
                        <div style="font-size: 10px;">ග්‍රොරොසරි & හාර්ඩ්වෙයාර්</div>
                        <div style="font-size: 10px;">අඩුම මිලට ඔබේ තැන</div>
                    </div>

                    <div id="items-square-container">
                        <div class="flex justify-between mb-1" style="font-size: 16px; font-weight: bold; border-bottom: 1px solid black;">
                            <span style="width:15%">ප්‍රමා</span>
                            <span style="width:29%">සි මිල</span>
                            <span style="width:33%">අපේ මිල</span>
                            <span style="width:20%; text-align:right">මුදල</span>
                        </div>
                        <div id="print-items"></div>
                    </div>

                    <div id="print-totals" class="text-right mt-1"></div>
                    <div class="text-center mt-2" style="font-size: 11px; font-weight: bold; border-top: 1px dashed black; padding-top: 5px;">ස්තූතියි නැවත එන්න!</div>
                </div>
            </div>
        </div>

        <div id="tab-inventory" class="tab-content">
            <h2 class="font-bold mb-2 p-2">Inventory Management</h2>
            <div id="inventory-list" class="space-y-2 px-2"></div>
        </div>

        <div id="tab-add-items" class="tab-content">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-4">Setup New Item</h2>
                <input type="text" id="add-code" placeholder="Item Code" class="w-full p-2 border mb-2">
                <input type="text" id="add-name" placeholder="Item Name" class="w-full p-2 border mb-2 uppercase">
                <input type="number" id="add-price" placeholder="Selling Price (LKR)" class="w-full p-2 border mb-2">
                <input type="number" id="add-wholesale" placeholder="Wholesale Price" class="w-full p-2 border mb-2">
                <input type="number" id="add-stock" placeholder="Initial Stock" class="w-full p-2 border mb-2">
                <button onclick="saveNewItem()" class="w-full bg-blue-600 text-white py-2 rounded">Save Product</button>
            </div>
        </div>

        <div id="tab-customers" class="tab-content">
            <div class="bg-white p-4 rounded shadow mb-4">
                <input type="text" id="cust-name" placeholder="Customer Name" class="w-full p-2 border mb-2">
                <input type="text" id="cust-phone" placeholder="Phone Number" class="w-full p-2 border mb-2">
                <button onclick="saveCustomer()" class="w-full bg-blue-600 text-white py-2 rounded">Add Customer</button>
            </div>
            <div id="customer-list" class="space-y-2"></div>
        </div>

        <div id="tab-reports" class="tab-content">
            <div class="bg-white p-4 rounded shadow mb-4">
                <h2 class="font-bold mb-3">Business Reports</h2>
                <div class="flex gap-2 mb-4">
                    <button onclick="setReportFilter('day')" class="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-bold">Daily</button>
                    <button onclick="setReportFilter('week')" class="flex-1 bg-blue-100 text-blue-800 py-2 rounded text-xs font-bold">Weekly</button>
                    <button onclick="setReportFilter('month')" class="flex-1 bg-blue-100 text-blue-800 py-2 rounded text-xs font-bold">Monthly</button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-green-100 p-3 rounded border border-green-200">
                        <p class="text-[10px] uppercase font-bold text-green-700">Profit</p>
                        <h1 id="rep-profit" class="text-xl font-bold">0.00</h1>
                    </div>
                    <div class="bg-blue-100 p-3 rounded border border-blue-200">
                        <p class="text-[10px] uppercase font-bold text-blue-700">Sales</p>
                        <h1 id="rep-sales" class="text-xl font-bold">0.00</h1>
                    </div>
                </div>
                <div id="bill-history-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
            </div>
        </div>

        <div id="tab-printer" class="tab-content">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-4">Branding Setup</h2>
                <div class="mb-6 p-3 border rounded bg-blue-50">
                    <label class="block font-bold text-sm mb-2">Upload Bill Logo:</label>
                    <input type="file" onchange="handleLogoUpload(this)" class="text-sm">
                    <button onclick="removeLogo()" class="mt-2 text-red-500 text-xs block underline">Remove Logo</button>
                </div>
                <div id="printer-status" class="mb-4 p-3 bg-gray-100 rounded text-sm">Status: Not Connected</div>
                <button onclick="connectAndSaveBluetooth()" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Connect Printer</button>
            </div>
        </div>
    </main>

    <script>
        const db = new Dexie("PiyaratnePOS");
        db.version(3).stores({
            inventory: "code, name, price, wholesale, stock",
            customers: "name, phone, status, creditAmount",
            sales: "++id, date, total, profit, customer, type, items",
            draftCart: "++id, name, code, qty, price, wholesale, total, discount"
        });

        let cart = [];
        let paymentMode = 'cash';
        let bleDevice = null;
        let bleCharacteristic = null;
        let currentFilter = 'day';

        // --- PRINTER & LOGO ---
        async function connectAndSaveBluetooth() {
            const status = document.getElementById('printer-status');
            try {
                status.innerText = "Searching...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }, { namePrefix: 'RP' }, { namePrefix: 'MTP' }],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                status.innerText = "Status: Connected to " + bleDevice.name;
            } catch (err) { status.innerText = "Error: " + err.message; }
        }

        function handleLogoUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('bill_logo', e.target.result);
                    loadLogo();
                };
                reader.readAsDataURL(file);
            }
        }

        function loadLogo() {
            const logoBase64 = localStorage.getItem('bill_logo');
            const imgElement = document.getElementById('receipt-logo');
            if (logoBase64) { 
                imgElement.src = logoBase64; 
                imgElement.style.display = 'block'; 
            } else { 
                imgElement.style.display = 'none'; 
            }
        }

        function removeLogo() { localStorage.removeItem('bill_logo'); loadLogo(); }

        // --- BILLING LOGIC ---
        async function searchItems(query) {
            const resultsDiv = document.getElementById('search-results');
            let items;
            if (query.length < 1) { items = await db.inventory.limit(20).toArray(); } 
            else { items = await db.inventory.filter(item => item.name.toLowerCase().includes(query.toLowerCase()) || item.code.toLowerCase().includes(query.toLowerCase())).toArray(); }
            if (items.length > 0) {
                resultsDiv.innerHTML = items.map(i => `
                    <div onclick="selectSearchResult('${i.code}', '${i.name}')">
                        <span class="font-bold">${i.name}</span> <span class="text-xs text-gray-500">(${i.code})</span>
                    </div>
                `).join('');
                resultsDiv.style.display = 'block';
            } else { resultsDiv.style.display = 'none'; }
        }

        async function selectSearchResult(code, name) {
            const qtyInput = prompt(`Qty for ${name}:`, "1");
            if (qtyInput === null) return;
            const qty = parseFloat(qtyInput);
            if (isNaN(qty) || qty <= 0) return;
            const item = await db.inventory.get(code);
            const discount = parseFloat(document.getElementById('bill-discount').value) || 0;
            const cartItem = { ...item, qty, discount, total: (item.price * qty) - discount };
            cart.push(cartItem);
            await db.draftCart.add(cartItem);
            renderCart();
            updateLivePreview();
            document.getElementById('bill-search').value = '';
            document.getElementById('search-results').style.display = 'none';
        }

        async function addUnlistedItem() {
            const name = prompt("Item Name:");
            const price = parseFloat(prompt("Price (LKR):"));
            if(name && !isNaN(price)) {
                const cartItem = { name: name.toUpperCase(), price, qty: 1, wholesale: price, total: price, discount: 0 };
                cart.push(cartItem); 
                await db.draftCart.add(cartItem);
                renderCart(); 
                updateLivePreview();
            }
        }

        async function removeFromCart(index) {
            const itemToRemove = cart[index];
            if(itemToRemove.id) { await db.draftCart.delete(itemToRemove.id); }
            cart.splice(index, 1); renderCart(); updateLivePreview();
        }

        function renderCart() {
            let total = cart.reduce((sum, i) => sum + i.total, 0);
            document.getElementById('cart-items').innerHTML = cart.map((i, index) => `
                <div class="flex justify-between border-b py-2 items-center">
                    <span class="font-bold text-slate-700">${i.name} x ${i.qty}</span>
                    <div class="flex gap-4">
                        <span>${i.total.toFixed(2)}</span>
                        <button onclick="removeFromCart(${index})" class="text-red-500 font-bold px-2">✕</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        // --- UPDATED LIVE PREVIEW (BIGGER FONT & GAPS) ---
        function updateLivePreview() {
            const subtotal = cart.reduce((sum, i) => sum + i.total, 0);
            const profit = cart.reduce((sum, i) => sum + (i.total - (i.wholesale * i.qty)), 0);
            const totalDiscountOnBill = cart.reduce((sum, i) => sum + (parseFloat(i.discount) || 0), 0);
            document.getElementById('print-items').innerHTML = cart.map(i => {
                const unitPriceAfterDiscount = i.total / i.qty;
                return `
                <div style="margin-bottom: 12px; border-bottom: 0.5px dashed #eee; padding-bottom: 5px;">
                    <div style="font-weight:bold; font-size: 14px; text-transform: uppercase;">${i.name}</div>
                    <div class="flex" style="font-size: 14px; justify-content: space-between;">
                        <span style="width:8%">${i.qty}</span>
                        <span style="width:20%">${i.price.toFixed(2)}</span>
                        <span style="width:25%; font-weight: bold;">${paymentMode === 'credit' ? i.price.toFixed(2) : unitPriceAfterDiscount.toFixed(2)}</span>
                        <span style="width:23%; text-align:right; font-weight: bold;">${i.total.toFixed(2)}</span>
                    </div>
                </div>
            `}).join('');

            let totalHtml = `
                <div style="border-top: 2px solid black; margin-top: 5px; padding-top: 5px;">
                    <div class="flex" style="justify-content: space-between; font-size: 19px; font-weight: bold;">
                        <span>මුළු මුදල:</span>
                        <span>LKR ${subtotal.toFixed(2)}</span>
                    </div>
                </div>
                <p style="font-size: 10px; margin-top: 4px;">Payment: ${paymentMode.toUpperCase()} | ${new Date().toLocaleString()}</p>
            `;
            document.getElementById('print-totals').innerHTML = totalHtml;
            
        }
          
        // --- FIXED DIRECT PRINT (HOLDS CSS PROPERTIES) ---
        async function directPrint() {
            const custName = document.getElementById('bill-customer').value;
            if(!custName) return alert("Select Customer");
            if(cart.length === 0) return;

            await db.sales.add({
                date: new Date().getTime(),
                total: cart.reduce((sum, i) => sum + i.total, 0),
                profit: cart.reduce((sum, i) => sum + (i.total - (i.wholesale * i.qty)), 0),
                customer: custName,
                type: paymentMode,
                items: JSON.parse(JSON.stringify(cart))
            });
            
            // This adds the profit line only if a discount exists
             if (totalDiscountOnBill > 0) {
    totalHtml += `
    <div class="flex justify-between" style="font-weight: bold; font-size: 13px; margin-top: 5px; border-top: 1px dashed black; padding-top: 5px;">
        <span>ඔබ ලැබූ ලාභය:</span>
        <span>LKR ${totalDiscountOnBill.toFixed(2)}</span>
    </div>`;
}

            // Deduction of stock
            for(let i of cart) {
                if(i.code) {
                    const invItem = await db.inventory.get(i.code);
                    if(invItem) await db.inventory.update(i.code, {stock: invItem.stock - i.qty});
                }
            }

            const printWindow = window.open('', '', 'width=400,height=600');
            printWindow.document.write(`
                <html>
                <head>
                    <style>
                        body { width: 58mm; font-family: 'Courier New', monospace; margin: 0; padding: 2mm; color: black; }
                        .receipt-border { text-align: center; line-height: 1.1; margin-bottom: 5px; border: 1.5px solid black; border-radius: 8px; padding: 5px; }
                        #items-square-container { border: 1.5px solid black; border-radius: 8px; padding: 6px; margin: 5px 0; }
                        .flex { display: flex; justify-content: space-between; }
                        .print-btn { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; }
                        @media print { .print-btn { display: none; } }
                    </style>
                </head>
                <body>
                    <button class="print-btn" onclick="window.print();window.close()">PRINT NOW</button>
                    ${document.getElementById('print-area').innerHTML}
                </body>
                </html>
            `);
            printWindow.document.close();
            
            cart = []; await db.draftCart.clear(); renderCart(); updateLivePreview();
        }

        // --- REST OF CORE LOGIC ---
        function setPaymentMode(mode) {
            paymentMode = mode;
            document.getElementById('btn-cash').className = mode === 'cash' ? 'flex-1 rounded bg-green-700 text-white text-xs font-bold' : 'flex-1 rounded bg-gray-200 text-xs font-bold';
            document.getElementById('btn-credit').className = mode === 'credit' ? 'flex-1 rounded bg-red-700 text-white text-xs font-bold' : 'flex-1 rounded bg-gray-200 text-xs font-bold';
            updateLivePreview();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            if(id === 'inventory') renderInventory();
            if(id === 'customers') renderCustomers();
            if(id === 'reports') calculateReports();
            if(id === 'billing') updateCustomerDropdown();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        async function saveNewItem() {
            const item = {
                code: document.getElementById('add-code').value,
                name: document.getElementById('add-name').value.toUpperCase(),
                price: parseFloat(document.getElementById('add-price').value),
                wholesale: parseFloat(document.getElementById('add-wholesale').value),
                stock: parseFloat(document.getElementById('add-stock').value)
            };
            await db.inventory.put(item);
            alert("Saved!");
            showTab('inventory');
        }

        async function renderInventory() {
            const items = await db.inventory.toArray();
            document.getElementById('inventory-list').innerHTML = items.map(i => `
                <div class="bg-white p-3 rounded shadow flex justify-between items-center ${i.stock < 10 ? 'border-l-4 border-red-500' : ''}">
                    <div><p class="font-bold">${i.name}</p><p class="text-xs">Price: ${i.price} | Stock: ${i.stock}</p></div>
                    <div class="text-right"><input type="number" onchange="updateStock('${i.code}', this.value)" value="${i.stock}" class="w-16 border rounded text-center"></div>
                </div>
            `).join('');
        }

        async function updateStock(code, val) { await db.inventory.update(code, {stock: parseFloat(val)}); }

        async function saveCustomer() {
            const name = document.getElementById('cust-name').value;
            if(!name) return;
            await db.customers.add({ name, phone: document.getElementById('cust-phone').value, status: 'cash', creditAmount: 0 });
            renderCustomers();
        }

        async function renderCustomers() {
            const list = await db.customers.toArray();
            document.getElementById('customer-list').innerHTML = list.map(c => `
                <div class="bg-white p-3 rounded flex justify-between shadow">
                    <div><p class="font-bold">${c.name}</p><p class="text-xs uppercase">${c.status}: ${c.creditAmount.toFixed(2)}</p></div>
                    <button onclick="settleCredit('${c.name}')" class="bg-green-100 px-3 py-1 rounded border border-green-500 text-xs">Settle</button>
                </div>
            `).join('');
        }

        async function settleCredit(name) {
            const amount = parseFloat(prompt(`Enter amount paid by ${name}:`));
            if(isNaN(amount)) return;
            const c = await db.customers.get(name);
            const newAmount = Math.max(0, c.creditAmount - amount);
            await db.customers.update(name, { creditAmount: newAmount, status: newAmount <= 0 ? 'cash' : 'credit' });
            renderCustomers();
        }

        async function updateCustomerDropdown() {
            const list = await db.customers.toArray();
            document.getElementById('bill-customer').innerHTML = '<option value="">Select Customer</option>' + list.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        async function calculateReports() {
            const sales = await db.sales.toArray();
            document.getElementById('rep-profit').innerText = sales.reduce((s,a) => s+a.profit, 0).toFixed(2);
            document.getElementById('rep-sales').innerText = sales.reduce((s,a) => s+a.total, 0).toFixed(2);
        }

        let html5QrCode;
        async function startScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (decodedText) => {
                    const item = await db.inventory.get(decodedText);
                    if(item) { stopScanner(); selectSearchResult(item.code, item.name); }
                });
            } catch (err) { stopScanner(); }
        }
        function stopScanner() { if(html5QrCode) html5QrCode.stop().then(() => document.getElementById('scanner-container').classList.add('hidden')); }

        function setReportFilter(range) { currentFilter = range; calculateReports(); }

        async function init() {
            const savedCart = await db.draftCart.toArray();
            if(savedCart.length > 0) { cart = savedCart; renderCart(); }
            loadLogo(); updateCustomerDropdown(); updateLivePreview();
        }
        init();
    </script>
</body>
</html>
